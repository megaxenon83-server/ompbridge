services:
  chatompompwol:
    image: chatompompwol
    build: .
    container_name: chatompompwol
    hostname: chatompompwol
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WOL_TOKEN: ${WOL_TOKEN:-}
      WOL_BIND: ${WOL_BIND:-}
      WOL_BROADCAST: ${WOL_BROADCAST:-255.255.255.255}
    volumes:
      - relay-data:/data
volumes:
  relay-data:
