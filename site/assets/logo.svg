<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C12"/>
      <stop offset="100%" stop-color="#1A1330"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#10A37F"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle glow rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad2)" stroke-width="1" opacity="0.2"/>

  <!-- Bridge icon (two connected nodes) -->
  <g transform="translate(256, 256)">
    <!-- Left node (PC) -->
    <circle cx="-70" cy="0" r="48" fill="url(#accentGrad)" filter="url(#glow)"/>
    <rect x="-84" y="-14" width="28" height="28" rx="6" fill="#0A0C12"/>
    <rect x="-80" y="-10" width="20" height="4" rx="2" fill="url(#accentGrad)"/>
    <rect x="-80" y="-2" width="20" height="4" rx="2" fill="url(#accentGrad)" opacity="0.7"/>
    <rect x="-80" y="6" width="16" height="4" rx="2" fill="url(#accentGrad)" opacity="0.5"/>

    <!-- Right node (Phone) -->
    <circle cx="70" cy="0" r="48" fill="url(#accentGrad2)" filter="url(#glow)"/>
    <rect x="52" y="-30" width="36" height="60" rx="10" fill="#0A0C12"/>
    <rect x="58" y="-24" width="24" height="4" rx="2" fill="url(#accentGrad2)"/>
    <rect x="58" y="-14" width="24" height="4" fill="url(#accentGrad2)" opacity="0.7"/>
    <rect x="58" y="-4" width="24" height="4" fill="url(#accentGrad2)" opacity="0.5"/>
    <rect x="58" y="6" width="24" height="4" fill="url(#accentGrad2)" opacity="0.5"/>
    <rect x="58" y="16" width="20" height="4" fill="url(#accentGrad2)" opacity="0.4"/>
    <circle cx="70" cy="28" r="4" fill="url(#accentGrad2)"/>

    <!-- Connection arc -->
    <path d="M -22 0 Q 0 -60 22 0" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -22 0 Q 0 60 22 0" fill="none" stroke="url(#accentGrad2)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Data packets on the arc -->
    <circle cx="-10" cy="-20" r="4" fill="url(#accentGrad)" opacity="0.9">
      <animate attributeName="cx" values="-22;70" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;-20;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="20" r="3" fill="url(#accentGrad2)" opacity="0.9">
      <animate attributeName="cx" values="22;-70" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;20;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- "N" monogram at bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="48" font-weight="800" fill="url(#accentGrad)" letter-spacing="-2">N</text>
</svg>