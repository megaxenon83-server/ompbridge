<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Nimay OMP Chat — your OMP agent, on your phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C12"/>
      <stop offset="55%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#1A1330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#10A37F"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Screenshot masks for rounded corners -->
    <mask id="phoneMask">
      <rect x="0" y="0" width="280" height="500" rx="28" fill="white"/>
    </mask>
    <mask id="desktopMask">
      <rect x="0" y="0" width="320" height="200" rx="12" fill="white"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Subtle ambient glow -->
  <ellipse cx="180" cy="100" rx="320" ry="260" fill="#10A37F" opacity="0.08" filter="url(#glow)"/>
  <ellipse cx="1100" cy="540" rx="300" ry="220" fill="#168BFF" opacity="0.06" filter="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M160 0 V640 M400 0 V640 M640 0 V640 M880 0 V640 M1120 0 V640"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(80,60)">
    <circle cx="34" cy="34" r="32" fill="url(#accent)"/>
    <path d="M20 34 L18 34 A12 12 0 0 1 30 22 L30 20 A14 14 0 0 0 34 34 L52 34" fill="none" stroke="#0A0C12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="34" r="3" fill="#0A0C12"/>
  </g>

  <!-- Title -->
  <text x="80" y="178" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="-2.5" fill="#F7F9FC">
    Nimay <tspan fill="url(#accent)">OMP Chat</tspan>
  </text>

  <rect x="84" y="192" width="150" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="254" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" fill="#DCE4F2">Run OMP on your own PC. Chat from your phone.</text>

  <text x="80" y="292" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="19" fill="#8A99B3">Two-way provider sync • QR pairing • Windows · Linux · Flatpak · Android</text>

  <!-- Feature badges -->
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="84" y="334" width="200" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="112" cy="355" r="5.5" fill="#10A37F"/>
    <text x="128" y="361" fill="#C8D4E8">Provider sync</text>

    <rect x="300" y="334" width="130" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="328" cy="355" r="5.5" fill="#168BFF"/>
    <text x="344" y="361" fill="#C8D4E8">QR pairing</text>

    <rect x="446" y="334" width="180" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="474" cy="355" r="5.5" fill="#10A37F"/>
    <text x="490" y="361" fill="#C8D4E8">Self-hosted</text>

    <rect x="642" y="334" width="220" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="670" cy="355" r="5.5" fill="#7C8CFF"/>
    <text x="686" y="361" fill="#C8D4E8">Win · Linux · Flatpak · Android</text>
  </g>

  <text x="80" y="430" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="17" fill="#6E7C93">Free and open source (MIT) • Your keys never leave your machine • Built for OMP</text>

  <!-- ========== SCREENSHOTS ROW ========== -->
  <!-- Phone screenshots (using actual app screenshots) -->
  
  <!-- Chat screenshot -->
  <g transform="translate(80, 460)" filter="url(#shadow)">
    <image href="docs/images/chat.png" x="0" y="0" width="280" height="500" mask="url(#phoneMask)"/>
    <rect x="0" y="0" width="280" height="500" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <text x="140" y="530" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#A0B0C8">Chat</text>
  </g>

  <!-- Session screenshot -->
  <g transform="translate(380, 460)" filter="url(#shadow)">
    <image href="docs/images/session.png" x="0" y="0" width="280" height="500" mask="url(#phoneMask)"/>
    <rect x="0" y="0" width="280" height="500" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <text x="140" y="530" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#A0B0C8">Session</text>
  </g>

  <!-- Models screenshot -->
  <g transform="translate(680, 460)" filter="url(#shadow)">
    <image href="docs/images/models.png" x="0" y="0" width="280" height="500" mask="url(#phoneMask)"/>
    <rect x="0" y="0" width="280" height="500" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <text x="140" y="530" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#A0B0C8">Models</text>
  </g>

  <!-- Providers screenshot -->
  <g transform="translate(980, 460)" filter="url(#shadow)">
    <image href="docs/images/providers.png" x="0" y="0" width="280" height="500" mask="url(#phoneMask)"/>
    <rect x="0" y="0" width="280" height="500" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <text x="140" y="530" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#A0B0C8">Providers</text>
  </g>

  <!-- Bottom attribution -->
  <text x="640" y="615" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="13" fill="#4A5A73">Actual Nimay OMP Chat screenshots • Built with OMP, Jetpack Compose, Node.js</text>
</svg>