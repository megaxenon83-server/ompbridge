<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Nimay OMP Chat â€” Your OMP agent, on your phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C12"/>
      <stop offset="55%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#1A1330"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB454" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#FF8A3D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#FF9A3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB454"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B27"/>
      <stop offset="100%" stop-color="#0C0F17"/>
    </linearGradient>
    <linearGradient id="bubbleIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232B3B"/>
      <stop offset="100%" stop-color="#1B2230"/>
    </linearGradient>
    <linearGradient id="phoneEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B465E"/>
      <stop offset="45%" stop-color="#1B2130"/>
      <stop offset="100%" stop-color="#39445B"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- ambient warmth -->
  <ellipse cx="150" cy="120" rx="360" ry="300" fill="url(#sunGlow)"/>
  <ellipse cx="1120" cy="580" rx="320" ry="240" fill="#6C4DFF" opacity="0.16" filter="url(#soft)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M160 0 V640 M400 0 V640 M640 0 V640 M880 0 V640 M1120 0 V640"/>
  </g>

  <!-- sun mark -->
  <g transform="translate(96,78)">
    <circle cx="36" cy="36" r="34" fill="url(#sunCore)"/>
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <path d="M36 -12 V-26"/><path d="M36 84 V98"/>
      <path d="M-12 36 H-26"/><path d="M84 36 H98"/>
      <path d="M3 3 L-6 -6"/><path d="M69 69 L78 78"/>
      <path d="M69 3 L78 -6"/><path d="M3 69 L-6 78"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="92" y="268" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-3" fill="#F7F9FC">Omni<tspan fill="url(#accent)">Desk</tspan></text>

  <rect x="96" y="296" width="132" height="7" rx="3.5" fill="url(#accent)"/>

  <text x="92" y="368" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#DCE4F2">Your OMP agent, on your phone.</text>

  <text x="92" y="414" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="21" fill="#8A99B3">Run OMP on your own PC. Talk to it from your phone â€”</text>
  <text x="92" y="444" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="21" fill="#8A99B3">providers, API keys and models stay in sync.</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="92" y="500" width="212" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="120" cy="523" r="6" fill="#10A37F"/>
    <text x="140" y="530" fill="#C8D4E8">Two-way provider sync</text>

    <rect x="320" y="500" width="150" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="348" cy="523" r="6" fill="#FFB454"/>
    <text x="368" y="530" fill="#C8D4E8">Self-hosted</text>

    <rect x="486" y="500" width="268" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="514" cy="523" r="6" fill="#7C8CFF"/>
    <text x="534" y="530" fill="#C8D4E8">Windows Â· Linux Â· Flatpak Â· Android</text>
  </g>

  <text x="92" y="594" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="18" fill="#6E7C93">Free and open source (MIT) Â· Your keys never leave your machine</text>

  <!-- phone -->
  <g transform="translate(830,44)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="552" rx="46" fill="url(#phoneEdge)"/>
    <rect x="8" y="8" width="344" height="536" rx="40" fill="url(#screen)"/>
    <rect x="140" y="22" width="80" height="14" rx="7" fill="#000000" opacity="0.55"/>

    <!-- app bar -->
    <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
      <text x="30" y="70" font-size="19" font-weight="700" fill="#EEF2F8">Nimay OMP Chat</text>
      <circle cx="30" cy="92" r="5" fill="#10A37F"/>
      <text x="42" y="97" font-size="13" fill="#7D8CA5">Connected Â· PC 2</text>
    </g>

    <!-- chat bubbles -->
    <rect x="112" y="122" width="216" height="52" rx="18" fill="#2E3547"/>
    <text x="130" y="146" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14" fill="#DCE4F2">Fix the failing test</text>
    <text x="130" y="165" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14" fill="#DCE4F2">in the sync module.</text>

    <rect x="30" y="190" width="250" height="76" rx="18" fill="url(#bubbleIn)" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="48" y="214" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" fill="#9FB0C9">Found it â€” the provider id was</text>
    <text x="48" y="233" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" fill="#9FB0C9">derived from the preset. Fixed,</text>
    <text x="48" y="252" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" fill="#9FB0C9">tests pass. Synced to your PC.</text>

    <!-- provider card -->
    <rect x="30" y="282" width="298" height="92" rx="16" fill="#151A25" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="54" cy="308" r="9" fill="#10A37F" opacity="0.9"/>
    <text x="74" y="313" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#E6ECF6">openai</text>
    <text x="48" y="338" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" fill="#7D8CA5">gpt-5 Â· o3 Â· codex-mini</text>
    <rect x="228" y="296" width="84" height="28" rx="14" fill="#FFB454" fill-opacity="0.16" stroke="#FFB454" stroke-opacity="0.4"/>
    <text x="247" y="315" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FFC978">Synced</text>

    <!-- composer -->
    <rect x="30" y="470" width="298" height="52" rx="26" fill="#161C28" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="54" y="502" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14.5" fill="#6E7C93">Ask OMP anythingâ€¦</text>
    <circle cx="302" cy="496" r="17" fill="url(#accent)"/>
    <path d="M295 496 h14 M303 490 l6 6 -6 6" stroke="#10141C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

