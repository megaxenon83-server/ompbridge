name: Bug report
description: Report a problem with OMP Desktop, Chat OMP OMP, or Bridge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more context you add, the faster we can help.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android app
        - OMP Desktop
        - Bridge (PC)
        - Windows installer
        - Provider sync
        - Documentation
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the applicable Bridge, Desktop, Android app, and Oh My Pi versions.
      placeholder: "Bridge 2.9.36, Desktop 0.8.2, app 0.2.2"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Windows 11 and Android 14"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message if there is one
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Bridge log
      description: Relevant lines from bridge.stderr.log for a Windows-side issue
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed API keys, tokens and other secrets from this report
          required: true
