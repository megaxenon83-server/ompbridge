name: Bug report
description: Something in OmniDesk does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more context you add, the faster we can help.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android app
        - Bridge (PC)
        - Windows installer
        - Linux package (.deb / .rpm / tarball)
        - Flatpak
        - Provider sync
        - Documentation
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Bridge version (Settings → PC and bridge) and app version (Settings → About)
      placeholder: "Bridge 2.9.28, app 4.2.6, Android 14"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Windows 11 / Ubuntu 24.04 / Fedora 41 / flatpak"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message if there is one
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Bridge log
      description: Output from Settings → Diagnostics → Fetch log, if the issue is on the PC side
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed API keys, tokens and other secrets from this report
          required: true
