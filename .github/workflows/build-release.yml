name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v2.9.28)'
        required: true
        type: string

env:
  ANDROID_VERSION: 4.2.7
  REPO: megaxenon83-server/ompbridge
  ANDROID_PROJECT: android-source/nimayomp-chatgpt-ui-4.2.3

jobs:
  # ------------------------------------------------------------------ ANDROID
  android-build:
    name: Android APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.android_version }}
      apk_path: ${{ steps.package.outputs.apk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set versions
        id: version
        run: |
          # Extract version from tag (e.g. refs/tags/v2.9.29 -> 2.9.29)
          # or use the workflow_dispatch input if provided
          if [ -n "${{ github.event.inputs.version }}" ]; then
            BRIDGE_VER="${{ github.event.inputs.version }}"
          else
            BRIDGE_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "bridge_version=${BRIDGE_VER}" >> "$GITHUB_OUTPUT"
          echo "android_version=${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-source/**/*.gradle*', 'android-source/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NIMAYOMP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIMAYOMP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIMAYOMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIMAYOMP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Android signing secrets are not configured in the repository"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/Nimay OMP Chat-release.jks"
          cat > "${ANDROID_PROJECT}/keystore.properties" << EOF
          storeFile=$RUNNER_TEMP/Nimay OMP Chat-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore restored (passwords are never printed)."

      - name: Build release APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          chmod +x gradlew
          # A clean build avoids stale BuildConfig constants when only the
          # version numbers changed (incremental Kotlin compilation can keep an
          # inlined VERSION_NAME/VERSION_CODE from a previous build).
          ./gradlew clean :app:assembleChstgptRelease --no-daemon --stacktrace

      - name: Package APK
        id: package
        run: |
          set -euo pipefail
          APK_PATH="$(find "${ANDROID_PROJECT}/app/build/outputs/apk" -name '*.apk' -path '*release*' | head -1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/nimay-omp-chat-android-${ANDROID_VERSION}.apk"
          (cd dist && sha256sum "nimay-omp-chat-android-${ANDROID_VERSION}.apk" > "nimay-omp-chat-android-${ANDROID_VERSION}.apk.sha256")
          echo "apk_path=dist/nimay-omp-chat-android-${ANDROID_VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "Packaged $APK_PATH"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/nimay-omp-chat-android-*.apk
            dist/nimay-omp-chat-android-*.sha256
          if-no-files-found: error

  # ------------------------------------------------------------------- LINUX
  linux-build:
    name: Linux (.deb, .rpm, Flatpak)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.bridge_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set versions
        id: version
        run: |
          # Extract version from tag (e.g. refs/tags/v2.9.29 -> 2.9.29)
          # or use the workflow_dispatch input if provided
          if [ -n "${{ github.event.inputs.version }}" ]; then
            BRIDGE_VER="${{ github.event.inputs.version }}"
          else
            BRIDGE_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "bridge_version=${BRIDGE_VER}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak-builder \
            rpm \
            dpkg-dev \
            nodejs \
            npm \
            python3 \
            curl \
            wget \
            file \
            xz-utils

      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.freedesktop.Platform//24.08
          sudo flatpak install --noninteractive flathub org.freedesktop.Sdk//24.08
          sudo flatpak install --noninteractive flathub org.freedesktop.Sdk.Extension.node20//24.08
          flatpak list

      - name: Build tarball, .deb and .rpm
        run: |
          bash 2.9.26-bridge/packaging/build-linux-packages.sh "${{ steps.version.outputs.bridge_version }}" dist

      - name: Build Flatpak bundle
        run: |
          bash 2.9.26-bridge/packaging/build-flatpak.sh "${{ steps.version.outputs.bridge_version }}" dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # ----------------------------------------------------------------- WINDOWS
  windows-build:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: linux-build
    outputs:
      version: ${{ needs.linux-build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup 6 is already installed"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup 6 is already installed"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        env:
          BRIDGE_VERSION: ${{ needs.linux-build.outputs.version }}
        run: |
          & "2.9.26-bridge\build-installer\Build-Installer.ps1" -Version "$env:BRIDGE_VERSION" -OutputDir "dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- RELEASE
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [android-build, linux-build, windows-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          out="$PWD/SHA256SUMS"
          : > "$out"
          find . -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \
               -o -name '*.tar.gz' -o -name '*.apk' \) -print0 |
          while IFS= read -r -d '' f; do
            ( cd "$(dirname "$f")" && sha256sum -- "$(basename "$f")" ) >> "$out"
          done
          sort -o "$out" "$out"
          cat "$out"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nimay OMP Chat Bridge ${{ needs.linux-build.outputs.version }} + Nimay OMP Chat Android ${{ needs.android-build.outputs.version }}
          body: |
            ## Nimay OMP Chat Bridge ${{ needs.linux-build.outputs.version }}

            Bridge ${{ needs.linux-build.outputs.version }} with two-way provider synchronisation, and the
            Nimay OMP Chat Android app ${{ needs.android-build.outputs.version }}.

            ### Downloads
            - **Windows:** `Nimay-OMP-Chat-Bridge-Setup-${{ needs.linux-build.outputs.version }}.exe`
            - **Debian/Ubuntu:** `nimay-omp-chat-bridge_${{ needs.linux-build.outputs.version }}_amd64.deb`
            - **Fedora/RHEL:** `nimay-omp-chat-bridge-${{ needs.linux-build.outputs.version }}-1.x86_64.rpm`
            - **Flatpak:** `com.nimay.OMPChat-${{ needs.linux-build.outputs.version }}.flatpak`
            - **Universal tarball:** `nimay-omp-chat-bridge-linux-x86_64.tar.gz`
            - **Android:** `nimay-omp-chat-android-${{ needs.android-build.outputs.version }}.apk`
            - **Update manifest:** `https://omp.nimay.net/updates/latest.json` (primary, GitHub fallback)

            ### Installation
            **Windows:** run the `.exe` installer (per-user, no admin rights needed).
            **Linux (.deb):** `sudo dpkg -i nimay-omp-chat-bridge_*.deb` then run `nimay-omp-chat-bridge-install --local`.
            **Linux (.rpm):** `sudo rpm -i nimay-omp-chat-bridge-*.rpm` then run `nimay-omp-chat-bridge-install --local`.
            **Flatpak:** `flatpak install com.nimay.OMPChat-*.flatpak`.
            **Universal:** `tar -xzf nimay-omp-chat-bridge-linux-x86_64.tar.gz && ./install.sh`.
            **Android:** install the APK (`adb install nimay-omp-chat-android-*.apk`).

            ### Provider sync
            The bridge is the source of truth for providers and API keys
            (`~/.omp/agent/models.yml`). The Android app pulls on connect and can
            push added, edited and deleted providers with **Sync**.

            ### Checksums
            `SHA256SUMS` covers every artifact in this release. The universal
            tarball and the Android APK also ship individual `.sha256` files.
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.flatpak
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
            artifacts/**/*.apk
            artifacts/**/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------ OMP SITE DEPLOY
  deploy-omp-site:
    name: Deploy site, downloads and update manifest
    runs-on: ubuntu-latest
    needs: [create-release, android-build, linux-build, windows-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release payload and update manifest
        id: prep
        env:
          TAG: ${{ github.ref_name }}
          ANDROID_VERSION: ${{ needs.android-build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p deploy/downloads/"$TAG" deploy/downloads/latest deploy/updates deploy/site

          # Collect release artifacts
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \
               -o -name '*.tar.gz' -o -name '*.apk' -o -name '*SHA256SUMS*' \) -print0 |
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.sha256) ;; # skip individual sha files from site downloads
              *) cp "$f" "deploy/downloads/$TAG/$base" ;;
            esac
          done

          # Ensure SHA256SUMS present in versioned/latest downloads
          if [ ! -f "deploy/downloads/$TAG/SHA256SUMS" ]; then
            find artifacts -name 'SHA256SUMS' -type f -exec cp {} "deploy/downloads/$TAG/SHA256SUMS" \; -quit || true
          fi
          cp -f deploy/downloads/"$TAG"/* deploy/downloads/latest/ || true

          # Android versionCode (best effort)
          ANDROID_CODE="$(grep -m1 'versionCode' "${ANDROID_PROJECT}/app/build.gradle" | grep -oE '[0-9]+' | head -1 || echo 0)"

          node scripts/generate-omp-update-manifest.mjs \
            --artifacts artifacts \
            --tag "$TAG" \
            --android-version "$ANDROID_VERSION" \
            --android-version-code "$ANDROID_CODE" \
            --base-url "https://omp.nimay.net" \
            --out deploy/updates/latest.json

          # Site content from repo
          if [ -d site ]; then cp -a site/. deploy/site/; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to omp.nimay.net host (if configured)
        env:
          SSH_HOST: ${{ secrets.OMP_SITE_SSH_HOST }}
          SSH_USER: ${{ secrets.OMP_SITE_SSH_USER }}
          SSH_KEY: ${{ secrets.OMP_SITE_SSH_KEY }}
          TARGET_DIR: ${{ secrets.OMP_SITE_TARGET_DIR }}
          SSH_PORT: ${{ secrets.OMP_SITE_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ] || [ -z "${TARGET_DIR:-}" ]; then
            echo "OMP site deploy skipped: configure OMP_SITE_SSH_HOST, OMP_SITE_SSH_USER, OMP_SITE_SSH_KEY, OMP_SITE_TARGET_DIR (and optional OMP_SITE_SSH_PORT) secrets to enable automatic publishing to omp.nimay.net."
            exit 0
          fi
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/omp_site_key
          chmod 600 ~/.ssh/omp_site_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/omp_site_key -p "$PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET_DIR/downloads' '$TARGET_DIR/updates' '$TARGET_DIR/site'"

          rsync -az --delete -e "ssh -i ~/.ssh/omp_site_key -p $PORT -o StrictHostKeyChecking=no" deploy/site/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/site/"
          rsync -az -e "ssh -i ~/.ssh/omp_site_key -p $PORT -o StrictHostKeyChecking=no" deploy/downloads/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/downloads/"
          rsync -az -e "ssh -i ~/.ssh/omp_site_key -p $PORT -o StrictHostKeyChecking=no" deploy/updates/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/updates/"

          echo "Deployed ${{ github.ref_name }} to $SSH_HOST:$TARGET_DIR"

