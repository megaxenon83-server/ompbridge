name: Build & Release

on:
  push:
    tags:
      - 'omp-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. omp-bridge-2.9.63)'
        required: true
        type: string

env:
  REPO: megaxenon83-server/ompbridge

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------- ANDROID
  android:
    name: Android APK (Chat OMP OMP, WebView)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      apk: ${{ steps.package.outputs.apk }}
      version: ${{ steps.version.outputs.android_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: version
        shell: pwsh
        run: |
          $bridge = (Select-String -Path 'windows\Setup.iss' -Pattern '#define BridgeVersion "([^"]+)"').Matches.Groups[1].Value
          $desktop = (Get-Content 'clients\package.json' -Raw | ConvertFrom-Json).version
          $android = (Select-String -Path 'clients\android\AndroidManifest.xml' -Pattern 'android:versionName="([^"]+)"').Matches.Groups[1].Value
          echo "bridge_version=$bridge" >> $env:GITHUB_OUTPUT
          echo "desktop_version=$desktop" >> $env:GITHUB_OUTPUT
          echo "android_version=$android" >> $env:GITHUB_OUTPUT
          Write-Host "bridge=$bridge desktop=$desktop android=$android"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP\android-sdk"
          New-Item -ItemType Directory -Force -Path "$sdk\cmdline-tools" | Out-Null
          Invoke-WebRequest 'https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip' -OutFile "$env:RUNNER_TEMP\cmdline.zip"
          Expand-Archive "$env:RUNNER_TEMP\cmdline.zip" -DestinationPath "$env:RUNNER_TEMP\cmdline" -Force
          Move-Item "$env:RUNNER_TEMP\cmdline\cmdline-tools" "$sdk\cmdline-tools\latest"
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\cmdline-tools\latest\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Android platform + build-tools
        shell: pwsh
        run: |
          "y" | sdkmanager --licenses | Out-Host
          sdkmanager "platforms;android-35" "build-tools;35.0.0" | Out-Host

      - name: Restore Chat OMP OMP signing keystore
        id: keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.CHATOMP_KEYSTORE_BASE64 }}
        run: |
          if ($env:KEYSTORE_BASE64) {
            $path = "$env:RUNNER_TEMP\chatomp-release.jks"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            "KEYSTORE_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "restored=true" >> $env:GITHUB_OUTPUT
            Write-Host "Keystore restored (passwords never printed)."
          } else {
            echo "restored=false" >> $env:GITHUB_OUTPUT
            Write-Warning "CHATOMP_KEYSTORE_BASE64 is not set; the APK will be signed with a fresh development key and will NOT upgrade over an existing install."
          }

      - name: Build APK
        id: package
        shell: pwsh
        env:
          # Credentials for the Chat OMP OMP key (public in build-android.cjs);
          # only the keystore itself is secret.
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: chat-omp-dev
          KEY_PASSWORD: android
        run: |
          $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          node clients/scripts/build-android.cjs
          $apk = (Get-ChildItem 'clients\dist' -Recurse -Filter 'Chat-OMP-OMP-Android-*.apk' | Select-Object -First 1).FullName
          if (-not $apk) { throw 'APK not found' }
          echo "apk=$apk" >> $env:GITHUB_OUTPUT
          Write-Host "Built $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: clients/dist/**/Chat-OMP-OMP-Android-*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ DESKTOP
  desktop:
    name: OMP Desktop + Bridge (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      bridge: ${{ steps.package.outputs.bridge_exe }}
      desktop_zip: ${{ steps.package.outputs.desktop_zip }}
      desktop_exe: ${{ steps.package.outputs.desktop_exe }}
      version: ${{ steps.version.outputs.bridge_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: version
        shell: pwsh
        run: |
          $bridge = (Select-String -Path 'windows\Setup.iss' -Pattern '#define BridgeVersion "([^"]+)"').Matches.Groups[1].Value
          $desktop = (Get-Content 'clients\package.json' -Raw | ConvertFrom-Json).version
          echo "bridge_version=$bridge" >> $env:GITHUB_OUTPUT
          echo "desktop_version=$desktop" >> $env:GITHUB_OUTPUT
          Write-Host "bridge=$bridge desktop=$desktop"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies (Electron)
        working-directory: clients
        run: npm ci --no-audit --no-fund

      - name: Ensure Electron binary
        working-directory: clients
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules\electron\dist\electron.exe')) {
            node node_modules\electron\install.js
          }
          if (-not (Test-Path 'node_modules\electron\dist\electron.exe')) { throw 'Electron binary missing after install' }
          Write-Host "Electron: $((Get-Item 'node_modules\electron\dist\electron.exe').FullName)"

      - name: Build portable Desktop ZIP
        shell: pwsh
        run: |
          node clients/scripts/build.cjs
          $zip = (Get-ChildItem 'clients\dist' -Recurse -Filter 'OMP-Desktop-*-win-x64.zip' | Select-Object -First 1).FullName
          Write-Host "Built $zip"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and -not (Test-Path 'C:\Program Files\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Build installers
        id: package
        shell: pwsh
        run: |
          $iscc = if (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' } else { 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          $bridge = (Select-String -Path 'windows\Setup.iss' -Pattern '#define BridgeVersion "([^"]+)"').Matches.Groups[1].Value
          $desktop = (Get-Content 'clients\package.json' -Raw | ConvertFrom-Json).version
          & $iscc "windows\Setup.iss" "/DBridgeVersion=$bridge" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bridge installer failed' }
          & $iscc "windows\DesktopSetup.iss" "/DDesktopVersion=$desktop" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Desktop installer failed' }
          $bridge_exe = (Get-ChildItem 'windows\dist' -Filter 'OMP-Bridge-Setup-*.exe' | Select-Object -First 1).FullName
          $desktop_exe = (Get-ChildItem 'windows\dist' -Filter 'OMP-Desktop-Setup-*-win-x64.exe' | Select-Object -First 1).FullName
          $desktop_zip = (Get-ChildItem 'clients\dist' -Recurse -Filter 'OMP-Desktop-*-win-x64.zip' | Select-Object -First 1).FullName
          echo "bridge_exe=$bridge_exe" >> $env:GITHUB_OUTPUT
          echo "desktop_exe=$desktop_exe" >> $env:GITHUB_OUTPUT
          echo "desktop_zip=$desktop_zip" >> $env:GITHUB_OUTPUT
          Write-Host "bridge=$bridge_exe"
          Write-Host "desktop_exe=$desktop_exe"
          Write-Host "desktop_zip=$desktop_zip"

      - name: Upload installers + zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            windows/dist/OMP-Bridge-Setup-*.exe
            windows/dist/OMP-Desktop-Setup-*-win-x64.exe
            clients/dist/**/OMP-Desktop-*-win-x64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ RELEASE
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, desktop]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: version
        run: |
          BRIDGE=$(grep -oP '#define BridgeVersion "\K[^"]+' windows/Setup.iss)
          DESKTOP=$(node -p "require('./clients/package.json').version")
          ANDROID=$(grep -oP 'android:versionName="\K[^"]+' clients/android/AndroidManifest.xml)
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage assets + build source zip
        run: |
          set -euo pipefail
          mkdir -p stage
          find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.apk' \) -exec cp {} stage/ \;
          git archive --format=zip -o "stage/OMP-Suite-${{ steps.version.outputs.bridge }}-source.zip" HEAD
          (cd stage && sha256sum *.exe *.zip *.apk | sort -k2 > SHA256SUMS.txt)
          cat stage/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "OMP Bridge ${{ steps.version.outputs.bridge }} / Desktop ${{ steps.version.outputs.desktop }} / Android ${{ steps.version.outputs.android }}"
          draft: false
          prerelease: false
          files: |
            stage/*.exe
            stage/*.zip
            stage/*.apk
            stage/SHA256SUMS.txt
          body: |
            ## OMP Suite ${{ steps.version.outputs.bridge }}

            - Bridge ${{ steps.version.outputs.bridge }}
            - OMP Desktop ${{ steps.version.outputs.desktop }}
            - Chat OMP OMP Android ${{ steps.version.outputs.android }}

            ### Downloads
            - **OMP Bridge (Windows):** `OMP-Bridge-Setup-${{ steps.version.outputs.bridge }}.exe`
            - **OMP Desktop (Windows installer):** `OMP-Desktop-Setup-${{ steps.version.outputs.desktop }}-win-x64.exe`
            - **OMP Desktop (portable):** `OMP-Desktop-${{ steps.version.outputs.desktop }}-win-x64.zip`
            - **Chat OMP OMP (Android):** `Chat-OMP-OMP-Android-${{ steps.version.outputs.android }}.apk`
            - **Source:** `OMP-Suite-${{ steps.version.outputs.bridge }}-source.zip` (plus GitHub's automatic source archives)
            - **Checksums:** `SHA256SUMS.txt`

            See `CHANGELOG.md` for what changed this phase.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
