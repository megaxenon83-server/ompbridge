name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.9.27)'
        required: true
        type: string

env:
  VERSION: ${{ github.ref_name == '' && github.event.inputs.version || github.ref_name }}
  REPO: megaxenon83-server/ompbridge

jobs:
  # ---------- ANDROID BUILD ----------
  android-build:
    name: Android APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_path: ${{ steps.upload.outputs.apk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: set-version
        run: |
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Android version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Release APK
        working-directory: android-source/nimayomp-chatgpt-ui-4.2.3
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleChstgptRelease --no-daemon --stacktrace

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android-source/nimayomp-chatgpt-ui-4.2.3 -name "*.apk" -path "*/chstgpt/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          APK_PATH="${{ steps.find-apk.outputs.apk_path }}"
          NEW_NAME="nimay-omp-android-${VERSION}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Android artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.set-version.outputs.version }}
          path: ${{ steps.rename.outputs.apk_path }}

  # ---------- LINUX BUILD ----------
  linux-build:
    name: Linux (.deb, .rpm, Flatpak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deb_path: ${{ steps.package.outputs.deb_path }}
      rpm_path: ${{ steps.package.outputs.rpm_path }}
      flatpak_path: ${{ steps.flatpak.outputs.flatpak_path }}
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: set-version
        run: |
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak-builder \
            fpm \
            rpm \
            dpkg-dev \
            python3 \
            nodejs \
            npm \
            wget \
            curl \
            gnupg \
            file

      - name: Setup Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.node20//24.08

      - name: Prepare build directory
        id: prep
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          BUILD_DIR="build-linux-${VERSION}"
          mkdir -p "${BUILD_DIR}"
          
          # Copy bridge source
          cp -r 2.9.26-bridge/* "${BUILD_DIR}/"
          
          # Update version in installer
          sed -i "s/VERSION=\"2.9.27\"/VERSION=\"${VERSION}\"/" "${BUILD_DIR}/install.sh"
          sed -i "s/2.9.27/${VERSION}/g" "${BUILD_DIR}"/Nimay-OMP-Bridge-Setup.iss 2>/dev/null || true
          
          echo "build_dir=${BUILD_DIR}" >> $GITHUB_OUTPUT

      - name: Build install.sh tarball
        id: tarball
        working-directory: ${{ steps.prep.outputs.build_dir }}
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          ARCH="x86_64"
          
          # Create install.sh if not exists (use the one from repo)
          if [ ! -f install.sh ]; then
            # We'll create a minimal one here
            cat > install.sh << 'INSTALL_EOF'
#!/usr/bin/env bash
set -euo pipefail
echo "Nimay OMP Bridge installer - run manually"
echo "See: https://github.com/nimay/ompbridge/releases"
exit 0
INSTALL_EOF
            chmod +x install.sh
          fi
          
          # Create tarball for universal installer
          mkdir -p dist
          tar -czf "dist/ompbridge-linux-${ARCH}.tar.gz" \
            bridge/ tools/ commands/ install.sh 2>/dev/null || \
            tar -czf "dist/ompbridge-linux-${ARCH}.tar.gz" \
            bridge/ tools/ commands/
          
          # SHA256
          sha256sum "dist/ompbridge-linux-${ARCH}.tar.gz" > "dist/ompbridge-linux-${ARCH}.tar.gz.sha256"
          
          echo "tarball=dist/ompbridge-linux-${ARCH}.tar.gz" >> $GITHUB_OUTPUT

      - name: Build .deb package
        id: deb
        working-directory: ${{ steps.prep.outputs.build_dir }}
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          ARCH="amd64"
          
          mkdir -p deb-package/usr/local/bin
          mkdir -p deb-package/usr/local/share/nimay/ompbridge
          mkdir -p deb-package/usr/local/share/applications
          mkdir -p deb-package/DEBIAN
          
          # Copy files
          cp -r bridge tools commands deb-package/usr/local/share/nimay/ompbridge/
          cp install.sh deb-package/usr/local/bin/nimay-ompbridge-install
          chmod +x deb-package/usr/local/bin/nimay-ompbridge-install
          
          # Create desktop entry
          cat > deb-package/usr/local/share/applications/nimay-ompbridge.desktop << 'DESKTOP_EOF'
[Desktop Entry]
Name=Nimay OMP Bridge
Comment=Bridge between OMP on PC and OmpChat on Android
Exec=nimay-ompbridge-install
Icon=bridge
Terminal=false
Type=Application
Categories=Network;Development;
DESKTOP_EOF
          
          # Control file
          cat > deb-package/DEBIAN/control << CONTROL_EOF
Package: nimay-ompbridge
Version: ${VERSION}
Section: net
Priority: optional
Architecture: ${ARCH}
Maintainer: Nimay <nimay@example.com>
Description: Bridge between OMP on PC and OmpChat on Android
 Homepage: https://github.com/nimay/ompbridge
CONTROL_EOF
          
          # Postinst
          cat > deb-package/DEBIAN/postinst << 'POSTINST_EOF'
#!/bin/bash
set -e
echo "Nimay OMP Bridge installed. Run 'nimay-ompbridge-install' to set up."
exit 0
POSTINST_EOF
          chmod +x deb-package/DEBIAN/postinst
          
          # Build
          dpkg-deb --build deb-package
          mv deb-package.deb ../nimay-ompbridge_${VERSION}_${ARCH}.deb
          echo "deb_path=../nimay-ompbridge_${VERSION}_${ARCH}.deb" >> $GITHUB_OUTPUT

      - name: Build .rpm package
        id: rpm
        working-directory: ${{ steps.prep.outputs.build_dir }}
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          ARCH="x86_64"
          
          mkdir -p rpm-package/usr/local/bin
          mkdir -p rpm-package/usr/local/share/nimay/ompbridge
          
          cp -r bridge tools commands rpm-package/usr/local/share/nimay/ompbridge/
          cp install.sh rpm-package/usr/local/bin/nimay-ompbridge-install
          chmod +x rpm-package/usr/local/bin/nimay-ompbridge-install
          
          # Spec file
          cat > rpm-package.spec << SPEC_EOF
Name: nimay-ompbridge
Version: ${VERSION}
Release: 1%{?dist}
Summary: Bridge between OMP on PC and OmpChat on Android
License: MIT
URL: https://github.com/nimay/ompbridge
Source0: %{name}-%{version}.tar.gz
BuildArch: x86_64
Requires: systemd, bash, curl

%description
Bridge between OMP on PC and OmpChat on Android

%install
mkdir -p %{buildroot}/usr/local/bin
mkdir -p %{buildroot}/usr/local/share/nimay/ompbridge
cp -r * %{buildroot}/usr/local/share/nimay/ompbridge/
ln -s /usr/local/share/nimay/ompbridge/install.sh %{buildroot}/usr/local/bin/nimay-ompbridge-install

%files
/usr/local/bin/nimay-ompbridge-install
/usr/local/share/nimay/ompbridge/

%changelog
* $(date +"%a %b %d %Y") Nimay <nimay@example.com> - ${VERSION}-1
- Release ${VERSION}
SPEC_EOF
          
          # Create source tarball for rpmbuild
          tar -czf ~/rpmbuild/SOURCES/nimay-ompbridge-${VERSION}.tar.gz -C .. nimay-ompbridge-${VERSION} 2>/dev/null || true
          mkdir -p ~/rpmbuild/SOURCES
          tar -czf ~/rpmbuild/SOURCES/nimay-ompbridge-${VERSION}.tar.gz .
          
          rpmbuild -bb rpm-package.spec --define "_topdir $(pwd)/rpmbuild" 2>&1 | tail -20
          
          find . -name "*.rpm" -exec mv {} ../nimay-ompbridge-${VERSION}-1.x86_64.rpm \;
          echo "rpm_path=../nimay-ompbridge-${VERSION}-1.x86_64.rpm" >> $GITHUB_OUTPUT

      - name: Build Flatpak
        id: flatpak
        working-directory: ${{ steps.prep.outputs.build_dir }}
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          
          cat > com.nimay.OMPBridge.yml << FLATPAK_EOF
app-id: com.nimay.OMPBridge
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
command: nimay-ompbridge
finish-args:
  - --share=network
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: nimay-ompbridge
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/nimay/ompbridge
      - cp -r bridge tools commands /app/share/nimay/ompbridge/
      - install -m 755 install.sh /app/bin/nimay-ompbridge
      - |
        cat > /app/share/applications/com.nimay.OMPBridge.desktop << 'EOF'
        [Desktop Entry]
        Name=Nimay OMP Bridge
        Comment=Bridge between OMP on PC and OmpChat on Android
        Exec=nimay-ompbridge
        Icon=com.nimay.OMPBridge
        Terminal=false
        Type=Application
        Categories=Network;Development;
        EOF
    sources:
      - type: dir
        path: .
FLATPAK_EOF

          flatpak-builder --force-clean --install-deps-from=flathub \
            --install --user build-dir com.nimay.OMPBridge.yml 2>&1 | tail -30
          
          # Export flatpak bundle
          flatpak build-bundle --runtime --filesystem=host \
            ~/.local/share/flatpak/repo com.nimay.OMPBridge-${VERSION}.flatpak com.nimay.OMPBridge
          
          mv com.nimay.OMPBridge-${VERSION}.flatpak ../
          echo "flatpak_path=../com.nimay.OMPBridge-${VERSION}.flatpak" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ steps.set-version.outputs.version }}
          path: |
            *.deb
            *.rpm
            *.flatpak
            build-linux-*/dist/*.tar.gz
            build-linux-*/dist/*.sha256

  # ---------- WINDOWS BUILD ----------
  windows-build:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: linux-build
    outputs:
      exe_path: ${{ steps.package.outputs.exe_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: set-version
        run: |
          $version = "${{ needs.linux-build.outputs.version }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --version 6.3.1
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Windows build
        id: prep
        run: |
          $version = "${{ steps.set-version.outputs.version }}"
          $buildDir = "build-windows-${version}"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          Copy-Item -Recurse -Force "2.9.26-bridge\*" $buildDir\
          
          # Update version in ISS
          $issFile = "$buildDir\Nimay-OMP-Bridge-Setup.iss"
          if (Test-Path $issFile) {
            (Get-Content $issFile) -replace '#define MyAppVersion "2.9.27"', "#define MyAppVersion `"$version`"" | Set-Content $issFile
          }
          echo "build_dir=$buildDir" >> $env:GITHUB_OUTPUT

      - name: Compile Inno Setup
        id: compile
        working-directory: ${{ steps.prep.outputs.build_dir }}
        run: |
          $version = "${{ steps.set-version.outputs.version }}"
          iscc.exe Nimay-OMP-Bridge-Setup.iss
          $exe = "dist\Nimay-OMP-Bridge-Setup-${version}.exe"
          if (Test-Path $exe) {
            Copy-Item $exe "..\Nimay-OMP-Bridge-Setup-${version}.exe"
            echo "exe_path=..\Nimay-OMP-Bridge-Setup-${version}.exe" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Inno Setup compilation failed or output not found"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.set-version.outputs.version }}
          path: Nimay-OMP-Bridge-Setup-${{ steps.set-version.outputs.version }}.exe

  # ---------- RELEASE ----------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux-build, windows-build, android-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nimay OMP Bridge ${{ needs.linux-build.outputs.version }}
          body: |
            ## Nimay OMP Bridge ${{ needs.linux-build.outputs.version }}
            
            ### Installers
            - **Windows:** `Nimay-OMP-Bridge-Setup-${{ needs.linux-build.outputs.version }}.exe` (Inno Setup)
            - **Debian/Ubuntu:** `nimay-ompbridge_${{ needs.linux-build.outputs.version }}_amd64.deb`
            - **Fedora/RHEL:** `nimay-ompbridge-${{ needs.linux-build.outputs.version }}-1.x86_64.rpm`
            - **Flatpak:** `com.nimay.OMPBridge-${{ needs.linux-build.outputs.version }}.flatpak`
            - **Universal (Linux/macOS/WSL):** `ompbridge-linux-x86_64.tar.gz`
            - **Android:** `nimay-omp-android-${{ needs.android-build.outputs.version }}.apk`
            
            ### Installation
            **Windows:** Run the `.exe` installer.
            **Linux (deb):** `sudo dpkg -i nimay-ompbridge_*.deb && sudo apt-get install -f`
            **Linux (rpm):** `sudo rpm -i nimay-ompbridge-*.rpm`
            **Flatpak:** `flatpak install com.nimay.OMPBridge-*.flatpak`
            **Universal:** `tar -xzf ompbridge-linux-x86_64.tar.gz && ./install.sh`
            **Android:** Install APK via file manager or `adb install nimay-omp-android-*.apk`
            
            ### Verify checksums
            Check `.sha256` files for tarball verification.
            
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.flatpak
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}