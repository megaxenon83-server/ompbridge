app-id: com.nimay.OMPChat
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
command: nimay-omp-chat-bridge
finish-args:
  - --share=network
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: nimay-omp-chat-bridge
    buildsystem: simple
    build-commands:
      - |
        if [ -d nimay-omp-chat-bridge ]; then
          mv nimay-omp-chat-bridge/* . 2>/dev/null || true
          rmdir nimay-omp-chat-bridge 2>/dev/null || true
        fi
      - mkdir -p /app/share/nimay/omp-chat-bridge /app/bin /app/share/applications
      - cp -r bridge tools commands /app/share/nimay/omp-chat-bridge/
      - install -m 755 install.sh /app/share/nimay/omp-chat-bridge/install.sh
      - install -m 755 flatpak/nimay-omp-chat-bridge.sh /app/bin/nimay-omp-chat-bridge
      - install -m 644 flatpak/com.nimay.OMPChat.desktop /app/share/applications/com.nimay.OMPChat.desktop
    sources:
      - type: dir
        path: ..
        skip:
          - build-installer
          - '*.bak*'