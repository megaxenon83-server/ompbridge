<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src data:; media-src data:; base-uri 'none'; form-action 'none'">
  <title>Chat OMP OMP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="turn-ui.css">
  <link rel="stylesheet" href="interface.css">
  <script defer src="interface.js"></script>
  <script defer src="turn-ui.js"></script>
  <script defer src="voice-mode.js"></script>
  <script defer src="mobile.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-definitions" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.8-3.5A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m13.5 6.5 4 4M5 19l4.5-1 10-10a2.8 2.8 0 0 0-4-4l-10 10Z"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M5 9v10h14V9M9 13h6"/><rect x="3" y="5" width="18" height="4" rx="1"/></symbol>
    <symbol id="i-computers" viewBox="0 0 24 24"><rect x="3" y="4" width="13" height="10" rx="2"/><path d="M8 18h4m-2-4v4m9-10h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-5m1 3h4m-2-3v3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M6 8.5v7m12-7a6 6 0 0 1-6 6H6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Zm0 0v7h7"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h4m4 0h8M4 17h8m4 0h4"/><circle cx="10" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10m5.7-7a9 9 0 1 1-11.4 0"/></symbol>
  </svg>
  <header class="topbar">
    <button class="icon" id="historyBtn" aria-label="Samtaler"><span class="menu-icon"></span></button>
    <div class="title-group">
      <button id="topTitle" class="title-button" aria-label="Velg prosjekt"><b id="chatTitle">Chat OMP OMP</b><span id="projectLabel">Arbeidsområde</span></button>
    </div>
    <details id="tokenUsage" class="token-usage" aria-label="Tokenforbruk"><summary></summary><div class="token-breakdown"></div></details>
    <button class="icon compose-icon" id="newBtn" aria-label="Ny samtale">＋</button>
  </header>
  <section id="todoPanel" class="todo-panel" aria-label="OMP-oppgaver" hidden></section>
  <main id="timeline" aria-label="Samtale"><section id="welcome"></section><div id="messages"></div>
    <div id="generationRow" class="generation-row" hidden><div id="workIndicator" class="work-indicator" role="status"><span id="workLabel">OMP arbeider</span><span class="work-dots" aria-hidden="true">.<i>.</i><i>.</i></span></div><span id="generationSpeed"></span></div>
  </main>
  <footer>
    <button type="button" id="jumpLatest" class="jump-latest" aria-controls="timeline" aria-label="Gå til siste melding" title="Gå til siste melding" hidden><span aria-hidden="true">↓</span></button>
    <div id="workStatus" class="work-status" role="status" hidden></div>
    <div id="status" role="status"></div>
    <form id="composer">
      <div id="attachmentChip" hidden></div>
      <label class="sr-only" for="prompt">Melding</label>
      <textarea id="prompt" rows="1" placeholder="Skriv en oppgave …"></textarea>
      <div class="composer-controls">
        <button class="icon" id="attach" type="button" aria-label="Legg ved bilde">＋</button>
        <div class="model-slot"><button class="model-chip" id="modelBtn" type="button">Velg modell</button></div>
        <button class="icon composer-gear" id="composerSettings" type="button" aria-label="Innstillinger for samtalen" aria-haspopup="dialog" title="Resonnering, kontekst, plugins og skills">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg>
        </button>
        <button class="icon" id="voiceOpen" type="button" aria-label="Talemodus" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4m4-7v10m4-14v18m4-14v10m4-7v4"/></svg>
        </button>
        <button class="send" id="stop" type="button" aria-label="Stopp" hidden>■</button>
        <button class="send" id="send" type="submit" aria-label="Send">↑</button>
      </div>
      <div id="composerAdvanced" hidden>
        <select id="thinkingLevel" class="model-chip" aria-label="Resonneringsnivå" hidden></select>
        <button class="model-chip" id="lightContext" type="button" role="switch" aria-checked="false" title="Begrens ekstra prosjektkontekst">Lett</button>
        <div class="mobile-mode">
          <button type="button" id="modePicker" class="mode-trigger" aria-haspopup="dialog"><span aria-hidden="true"></span></button>
          <select id="chatMode" hidden aria-label="Arbeidsmodus"><option value="chat">Chat</option><option value="plan">Plan</option><option value="build" selected>Bygg</option></select>
        </div>
      </div>
    </form>
  </footer>
  <button class="scrim" id="scrim" aria-label="Lukk samtaler" hidden></button>
  <aside id="drawer" class="drawer" aria-label="Samtaler" hidden>
    <header><span class="brand-mark">O</span><b>Chat OMP OMP</b><button class="icon" id="savedChats" aria-label="Arkiv og papirkurv"></button><button class="icon" id="closeDrawer" aria-label="Lukk">×</button></header>
    <input id="search" type="search" placeholder="Søk i samtaler" aria-label="Søk i samtaler">
    <div class="drawer-primary">
      <button class="drawer-new" id="drawerNew">Ny samtale</button>
      <button id="projects" class="drawer-browse" aria-label="Prosjekter" title="Bla i prosjekter"></button>
    </div>
    <div id="threads"></div>
    <nav class="drawer-actions">
      <button id="computerPicker">PC-er</button>
      <button id="git">Git</button><button id="files">Filer</button>
      <button id="terminal">Terminal</button><button id="settings">Innstillinger</button><button id="powerSettings">Wake-on-LAN</button>
    </nav>
  </aside>
  <dialog id="sheet"><header><h2 id="sheetTitle"></h2><button class="icon" id="closeSheet" aria-label="Lukk">×</button></header><div id="sheetBody"></div></dialog>
  <dialog id="approval"><header><h2 id="approvalTitle">OMP</h2></header><div id="approvalBody"></div></dialog>
  <dialog id="voiceDialog" aria-labelledby="voiceTitle">
    <header><h2 id="voiceTitle">Talemodus</h2><button class="icon" id="voiceClose" type="button" aria-label="Lukk talemodus">×</button></header>
    <div class="voice-stage">
      <button id="voiceMode" type="button" aria-pressed="false" aria-label="Start eller stopp tale">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4m4-7v10m4-14v18m4-14v10m4-7v4"/></svg>
      </button>
      <p id="voiceStatus" role="status"></p>
    </div>
    <footer><label for="voiceLanguage">Talespråk</label>
      <select id="voiceLanguage"><option value="no">Norsk</option><option value="en">English</option></select>
    </footer>
  </dialog>
  <dialog id="modeChoices" class="mode-dialog mode-mobile" aria-labelledby="modeTitle">
    <div class="mode-header"><strong id="modeTitle">Arbeidsmodus</strong><button type="button" class="mode-close" aria-label="Lukk">×</button></div>
    <div class="mode-options"></div>
  </dialog>
</body>
</html>
